<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Titãs: Marvel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="battle-screen">
        <!-- ÁREA DOS HERÓIS NA BATALHA -->
        <div class="arena">
            <div class="hero-card" id="player-card">
                <h2 id="player-name">Homem de Ferro</h2>
                <div class="hp-bar"><div id="player-hp-fill"></div></div>
                <p id="player-hp-text">100 / 100 HP</p>
            </div>

            <div class="hero-card" id="enemy-card">
                <h2 id="enemy-name">Ultron</h2>
                <div class="hp-bar"><div id="enemy-hp-fill"></div></div>
                <p id="enemy-hp-text">100 / 100 HP</p>
            </div>
        </div>

        <!-- BARRA DE ENERGIA (ESTILO MINI TITÃS) -->
        <div class="energy-container">
            <p>ENERGIA DE COMBATE</p>
            <div class="energy-bar">
                <div id="energy-fill"></div>
            </div>
        </div>

        <!-- PAINEL DE GOLPES -->
        <div id="moves-container" class="moves-panel">
            <!-- Os botões de ataque serão gerados pelo JavaScript -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
