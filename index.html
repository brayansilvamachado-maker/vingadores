<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Titãs: Marvel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA DE SELEÇÃO DE EQUIPE (3 HERÓIS) -->
    <div id="selection-screen" class="screen">
        <h1>MONTE SEU TIME (ESCOLHA 3)</h1>
        <p id="select-subtitle">Clique nos heróis para adicionar à sua equipe</p>
        
        <div id="starter-heroes-container" class="cards-container"></div>
        
        <button id="btn-start-battle" class="btn-start hidden" onclick="iniciarBatalha()">COMEÇAR BATALHA</button>
    </div>

    <!-- TELA DE BATALHA -->
    <div id="battle-screen" class="screen hidden">
        <div class="team-bench-container">
            <p>SUA EQUIPE (CLIQUE PARA TROCAR)</p>
            <div id="team-bench" class="team-bench"></div>
        </div>

        <div class="arena">
            <div class="hero-card" id="player-card">
                <h2 id="player-name">Herói</h2>
                <div class="hp-bar"><div id="player-hp-fill"></div></div>
                <p id="player-hp-text">100 / 100 HP</p>
                <p id="player-status-text" class="status-badge"></p>
            </div>

            <div class="hero-card" id="enemy-card">
                <h2 id="enemy-name">Ultron</h2>
                <div class="hp-bar"><div id="enemy-hp-fill"></div></div>
                <p id="enemy-hp-text">150 / 150 HP</p>
                <p id="enemy-status-text" class="status-badge"></p>
            </div>
        </div>

        <!-- BARRA DE ENERGIA EM BLOCOS -->
        <div class="energy-container">
            <p>ENERGIA DE COMBATE</p>
            <div id="energy-blocks-container" class="energy-blocks"></div>
        </div>

        <div id="moves-container" class="moves-panel"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
