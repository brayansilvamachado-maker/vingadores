<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Titãs - Edição Vingadores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <div class="top-bar">
        <div class="coins">🪙 Moedas: <span id="coin-count">100</span></div>
        <button id="btn-toggle-shop" class="btn-shop" onclick="toggleLoja()">🛒 Loja</button>
    </div>

    <!-- TELA DE LOJA -->
    <div id="shop-screen" class="screen hidden">
        <h2>Loja de Heróis Marvel</h2>
        <div id="shop-container" class="cards-container"></div>
    </div>

    <!-- TELA DE SELEÇÃO DE TIME -->
    <div id="selection-screen" class="screen">
        <h2>Escolha seu Time de Combatentes</h2>
        
        <!-- Base estilo Teeny Titans com 3 plataformas circulares -->
        <div class="podium-base">
            <div class="podium-slot" id="slot-0"><span class="slot-text">+ Escolher</span></div>
            <div class="podium-slot center-slot" id="slot-1"><span class="slot-text">+ Escolher</span></div>
            <div class="podium-slot" id="slot-2"><span class="slot-text">+ Escolher</span></div>
        </div>

        <button id="btn-start-battle" class="btn-start hidden" onclick="iniciarBatalha()">GO!</button>

        <p class="select-label">Seus Bonecos:</p>
        <div id="starter-heroes-container" class="cards-container"></div>
    </div>

    <!-- TELA DE BATALHA -->
    <div id="battle-screen" class="screen hidden">
        <!-- SELEÇÃO DE BANCO / TROCA -->
        <div class="team-bench-container">
            <p>SEU TIME (Clique para trocar):</p>
            <div id="team-bench" class="team-bench"></div>
        </div>

        <!-- ARENA DE COMBATE -->
        <div class="arena">
            <!-- CARTÃO DO JOGADOR -->
            <div id="player-card" class="hero-card">
                <h3 id="player-name">Homem de Ferro</h3>
                <div class="hp-bar"><div id="player-hp-fill"></div></div>
                <span id="player-hp-text">110 / 110 HP</span>
                <div id="player-status-text" class="status-badge"></div>
            </div>

            <!-- CARTÃO DO INIMIGO -->
            <div id="enemy-card" class="hero-card">
                <h3 id="enemy-name">Thanos</h3>
                <div class="hp-bar"><div id="enemy-hp-fill"></div></div>
                <span id="enemy-hp-text">250 / 250 HP</span>
                <div id="enemy-status-text" class="status-badge"></div>
            </div>
        </div>

        <!-- BARRA DE ENERGIA -->
        <div class="energy-container">
            <p>⚡ ENERGIA DE BATALHA</p>
            <div id="energy-blocks-container" class="energy-blocks"></div>
        </div>

        <!-- PAINEL DE GOLPES -->
        <div id="moves-container" class="moves-panel"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
