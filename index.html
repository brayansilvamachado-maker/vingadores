<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Batalha com Animacoes e Moedas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a2e;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding-top: 60px;
    }

    /* BARRA SUPERIOR */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #0f3460;
      border-bottom: 2px solid #e94560;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      z-index: 1000;
    }

    .player-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: #e94560;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border: 2px solid #fff;
    }

    .player-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .player-name {
      font-size: 0.9rem;
      font-weight: bold;
    }

    .hp-bar-container {
      width: 120px;
      height: 10px;
      background-color: #1a1a2e;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #555;
    }

    .hp-bar-fill {
      width: 100%;
      height: 100%;
      background-color: #4ecc71;
      transition: width 0.3s ease;
    }

    .coin-display {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #ffd700;
      font-weight: bold;
      color: #ffd700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ARENA DE JOGO */
    .arena {
      position: relative;
      width: 400px;
      height: 250px;
      background: linear-gradient(180deg, #16213e 0%, #0f3460 100%);
      border: 3px solid #e94560;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .target {
      width: 80px;
      height: 80px;
      background-color: #e94560;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      transition: transform 0.1s ease;
      user-select: none;
    }

    /* Animação de tremor ao tomar dano */
    .shake {
      animation: shakeEffect 0.3s ease-in-out;
    }

    @keyframes shakeEffect {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-10px, 5px); }
      40% { transform: translate(10px, -5px); }
      60% { transform: translate(-5px, 5px); }
      80% { transform: translate(5px, -5px); }
      100% { transform: translate(0, 0); }
    }

    /* Animação visual do golpe (Corte) */
    .slash-effect {
      position: absolute;
      width: 150px;
      height: 6px;
      background: linear-gradient(90deg, transparent, #00fff2, #ffffff, transparent);
      box-shadow: 0 0 15px #00fff2;
      transform: rotate(-45deg) scaleX(0);
      opacity: 0;
      pointer-events: none;
    }

    .animate-slash {
      animation: slashAnim 0.4s ease-out forwards;
    }

    @keyframes slashAnim {
      0% { transform: rotate(-45deg) scaleX(0); opacity: 0; }
      50% { transform: rotate(-45deg) scaleX(1.5); opacity: 1; }
      100% { transform: rotate(-45deg) scaleX(2); opacity: 0; }
    }

    /* Animação das moedas flutuantes */
    .coin-pop {
      position: absolute;
      color: #ffd700;
      font-weight: bold;
      font-size: 1.2rem;
      text-shadow: 0 0 5px rgba(0,0,0,0.8);
      pointer-events: none;
      animation: coinFloat 1s forwards ease-out;
    }

    @keyframes coinFloat {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      50% { transform: translateY(-40px) scale(1.3); }
      100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
    }

    /* CONTROLES E BOTÕES */
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background-color: #e94560;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: #0f3460;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <div class="top-bar">
    <div class="player-profile">
      <div class="avatar">P1</div>
      <div class="player-info">
        <span class="player-name">Jogador (Nvl. 1)</span>
        <div class="hp-bar-container">
          <div class="hp-bar-fill"></div>
        </div>
      </div>
    </div>
    
    <div class="coin-display">
      <span id="coinCount">0</span> 🪙
    </div>
  </div>

  <!-- ARENA DE BATALHA -->
  <div class="arena" id="arena">
    <div class="target" id="target">Inimigo</div>
    <div class="slash-effect" id="slash"></div>
  </div>

  <!-- BOTÕES DE ATAQUE -->
  <div class="controls">
    <button onclick="executeAttack('Corte Fantasma', 45, 15)">Corte Fantasma (+15 🪙)</button>
    <button onclick="executeAttack('Explosão de Meteoro', 110, 50)">Meteoro (+50 🪙)</button>
  </div>

  <script>
    let totalCoins = 0;

    function executeAttack(attackName, damage, coinsEarned) {
      const target = document.getElementById('target');
      const slash = document.getElementById('slash');
      const arena = document.getElementById('arena');
      const coinCount = document.getElementById('coinCount');

      // 1. Executa a animação do golpe
      slash.classList.remove('animate-slash');
      void slash.offsetWidth; // Força o reflow para reiniciar a animação CSS
      slash.classList.add('animate-slash');

      // 2. Executa o impacto no inimigo e exibe moedas
      setTimeout(() => {
        target.classList.remove('shake');
        void target.offsetWidth;
        target.classList.add('shake');

        // Cria o texto flutuante com a quantidade de moedas
        spawnCoinText(arena, `+${coinsEarned} 🪙`);

        // Atualiza a soma total na barra superior
        totalCoins += coinsEarned;
        coinCount.innerText = totalCoins;
      }, 150);
    }

    function spawnCoinText(container, text) {
      const coin = document.createElement('div');
      coin.className = 'coin-pop';
      coin.innerText = text;
      
      // Variação ligeira da posição no eixo X para dar efeito dinâmico
      const randomX = (Math.random() - 0.5) * 40;
      coin.style.left = `calc(50% + ${randomX}px)`;
      coin.style.top = '40%';

      container.appendChild(coin);

      setTimeout(() => {
        coin.remove();
      }, 1000);
    }
  </script>
</body>
</html>
